<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>政府體制與民主治理｜憲政學院見習謀士</title>
<style>
:root {
  --ink: #0d2a22;
  --parchment: #e8f4f0;
  --parchment-dark: #cde8df;
  --red:  #1a5a4a;
  --gold: #2a8a6a;
  --gold-light: #4ab890;
  --jade: #0d3d2e;
  --shadow: rgba(13,42,34,0.18);
  --correct: #1a7a3a;
  --wrong: #8b1a1a;
  --star-on: #f5c518;
  --star-off: #aac8c0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--parchment);
  font-family: 'Noto Serif TC', 'Georgia', serif;
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

#app {
  width: 100%;
  max-width: 680px;
  padding: 16px;
}

/* ═══════════════════════════════════
   TITLE SCREEN
═══════════════════════════════════ */
#screen-title {
  text-align: center;
  padding: 24px 0 40px;
}

.title-seal {
  display: inline-block;
  width: 72px;
  height: 72px;
  border: 3px solid var(--red);
  border-radius: 8px;
  color: var(--red);
  font-size: 18px;
  font-weight: 900;
  line-height: 1.3;
  writing-mode: vertical-rl;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  background: white;
  box-shadow: 2px 2px 0 var(--red);
  letter-spacing: 4px;
}

.title-main {
  font-size: 26px;
  font-weight: 900;
  color: var(--red);
  letter-spacing: 2px;
  margin-bottom: 6px;
}

.title-sub {
  font-size: 14px;
  color: var(--gold);
  letter-spacing: 3px;
  margin-bottom: 4px;
}

.title-author {
  font-size: 12px;
  color: #5a8a7a;
  letter-spacing: 1px;
  margin-bottom: 16px;
}

.divider {
  width: 80px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 12px auto;
}

.title-desc {
  font-size: 13px;
  color: #3a6a5a;
  line-height: 1.8;
  max-width: 420px;
  margin: 0 auto 24px;
  padding: 12px 16px;
  background: rgba(42,138,106,0.08);
  border-left: 3px solid var(--gold);
  border-radius: 0 8px 8px 0;
  text-align: left;
}

/* MAP GRID */
.map-section {
  margin: 20px 0;
}

.map-title {
  font-size: 12px;
  color: #5a8a7a;
  letter-spacing: 2px;
  margin-bottom: 12px;
}

.map-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}

.map-node {
  aspect-ratio: 1;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  border: 2px solid transparent;
  position: relative;
  padding: 4px;
}

.map-node.locked {
  background: #c8dcd8;
  border-color: #a8c4be;
  cursor: not-allowed;
  opacity: 0.6;
}

.map-node.unlocked {
  background: white;
  border-color: var(--gold);
  box-shadow: 0 2px 8px var(--shadow);
}

.map-node.unlocked:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px var(--shadow);
}

.map-node.done-1 { background: #d4ece6; border-color: var(--gold); }
.map-node.done-2 { background: #b8ddd5; border-color: var(--red); }
.map-node.done-3 { background: var(--red); border-color: var(--jade); }
.map-node.done-3 .node-num,
.map-node.done-3 .node-name { color: white; }

.node-num {
  font-size: 18px;
  font-weight: 900;
  color: var(--red);
  line-height: 1;
}

.node-name {
  font-size: 9px;
  color: #3a6a5a;
  text-align: center;
  line-height: 1.3;
  margin-top: 2px;
}

.node-stars {
  font-size: 11px;
  margin-top: 2px;
  letter-spacing: -1px;
}

.node-lock {
  font-size: 16px;
  color: #90b0aa;
}

/* BUTTONS */
.btn-start, .btn-home, .btn-next, .btn-retry, .btn-map {
  display: block;
  width: 100%;
  max-width: 280px;
  margin: 8px auto;
  padding: 14px;
  border: 2px solid var(--red);
  border-radius: 10px;
  background: var(--red);
  color: white;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 2px;
  cursor: pointer;
  transition: all .15s;
  font-family: inherit;
}

.btn-start:hover, .btn-next:hover { background: var(--jade); border-color: var(--jade); }

.btn-home {
  background: transparent;
  color: var(--red);
  font-size: 13px;
  padding: 10px;
}

.btn-home:hover { background: var(--parchment-dark); }

.btn-retry {
  background: transparent;
  color: var(--red);
  max-width: 180px;
}

.btn-map {
  max-width: 180px;
  font-size: 13px;
  padding: 10px;
}

/* ═══════════════════════════════════
   LEVEL SCREEN
═══════════════════════════════════ */
#screen-level {
  padding: 12px 0 40px;
}

.level-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--parchment-dark);
}

.level-badge {
  background: var(--red);
  color: white;
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1px;
  white-space: nowrap;
}

.level-name {
  font-size: 16px;
  font-weight: 700;
  color: var(--red);
  flex: 1;
}

.level-prog {
  font-size: 12px;
  color: #5a8a7a;
  white-space: nowrap;
}

/* NARRATIVE */
.narrative-box {
  background: rgba(42,138,106,0.07);
  border: 1px solid rgba(42,138,106,0.25);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 16px;
  font-size: 13px;
  line-height: 1.8;
  color: #2a5a4a;
  position: relative;
}

.narrative-box::before {
  content: '📜';
  font-size: 16px;
  margin-right: 6px;
}

/* KNOWLEDGE CARD */
.knowledge-card {
  background: white;
  border: 2px solid var(--gold);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px var(--shadow);
}

.knowledge-card h4 {
  font-size: 14px;
  color: var(--red);
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--parchment-dark);
  letter-spacing: 1px;
}

.knowledge-card ul {
  list-style: none;
  padding: 0;
}

.knowledge-card ul li {
  font-size: 13px;
  line-height: 1.9;
  color: #1a3a2e;
  padding: 2px 0;
  border-bottom: 1px dashed rgba(42,138,106,0.15);
}

.knowledge-card ul li:last-child { border-bottom: none; }

.kw {
  color: var(--red);
  font-weight: 700;
}

.tag {
  display: inline-block;
  background: var(--parchment-dark);
  color: var(--red);
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 4px;
  font-weight: 700;
  margin-right: 3px;
}

/* QUIZ */
.quiz-card {
  background: white;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px var(--shadow);
  border: 1px solid var(--parchment-dark);
}

.quiz-num {
  font-size: 11px;
  color: #5a8a7a;
  letter-spacing: 2px;
  margin-bottom: 8px;
}

.quiz-q {
  font-size: 15px;
  line-height: 1.8;
  margin-bottom: 14px;
  color: var(--ink);
  font-weight: 500;
}

.opts-list {
  list-style: none;
}

.opt-btn {
  width: 100%;
  text-align: left;
  background: var(--parchment);
  border: 2px solid var(--parchment-dark);
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 8px;
  font-size: 14px;
  font-family: inherit;
  color: var(--ink);
  cursor: pointer;
  transition: all .15s;
  line-height: 1.6;
}

.opt-btn:hover:not(:disabled) {
  background: rgba(42,138,106,0.1);
  border-color: var(--gold);
}

.opt-btn.correct {
  background: rgba(26,122,58,0.12);
  border-color: var(--correct);
  color: #0d4a20;
  font-weight: 700;
}

.opt-btn.wrong {
  background: rgba(139,26,26,0.08);
  border-color: var(--wrong);
  color: #5a0d0d;
}

.opt-btn:disabled { cursor: default; }

.exp-box {
  margin-top: 10px;
  padding: 10px 14px;
  background: rgba(42,138,106,0.06);
  border-left: 3px solid var(--gold);
  border-radius: 0 8px 8px 0;
  font-size: 13px;
  line-height: 1.7;
  color: #1a4a3a;
  display: none;
}

.exp-box.show { display: block; }

.exp-icon { font-size: 14px; margin-right: 4px; }

/* PROGRESS BAR */
.progress-bar-wrap {
  background: var(--parchment-dark);
  border-radius: 4px;
  height: 6px;
  margin-bottom: 16px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold), var(--gold-light));
  border-radius: 4px;
  transition: width .4s ease;
}

/* COMPLETE SCREEN */
.complete-card {
  background: white;
  border: 2px solid var(--gold);
  border-radius: 16px;
  padding: 28px 20px;
  text-align: center;
  box-shadow: 0 4px 16px var(--shadow);
  margin: 20px 0;
}

.complete-stars {
  font-size: 32px;
  margin-bottom: 10px;
  letter-spacing: 4px;
}

.complete-title {
  font-size: 20px;
  font-weight: 900;
  color: var(--red);
  margin-bottom: 6px;
  letter-spacing: 2px;
}

.complete-score {
  font-size: 36px;
  font-weight: 900;
  color: var(--gold);
  margin: 10px 0;
}

.complete-msg {
  font-size: 14px;
  color: #3a6a5a;
  line-height: 1.7;
  margin-bottom: 16px;
}

.score-detail {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin: 12px 0;
  padding: 12px;
  background: var(--parchment);
  border-radius: 8px;
}

.score-item {
  text-align: center;
}

.score-label {
  font-size: 11px;
  color: #5a8a7a;
  display: block;
  margin-bottom: 2px;
}

.score-val {
  font-size: 20px;
  font-weight: 900;
  color: var(--red);
}

/* FINAL COMPLETE */
.final-card {
  text-align: center;
  padding: 32px 20px 40px;
}

.final-seal {
  width: 100px;
  height: 100px;
  border: 4px solid var(--red);
  border-radius: 12px;
  color: var(--red);
  font-size: 18px;
  font-weight: 900;
  writing-mode: vertical-rl;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  background: white;
  box-shadow: 4px 4px 0 var(--red);
  letter-spacing: 6px;
  animation: stamp .4s ease-out;
}

@keyframes stamp {
  from { transform: scale(1.5); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}

.final-title {
  font-size: 22px;
  font-weight: 900;
  color: var(--red);
  margin-bottom: 8px;
  letter-spacing: 2px;
}

.final-desc {
  font-size: 14px;
  color: #3a6a5a;
  line-height: 1.8;
  max-width: 380px;
  margin: 0 auto 20px;
}

.stars-row {
  font-size: 20px;
  margin: 8px 0;
}

/* TOAST */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--red);
  color: white;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1px;
  transition: transform .3s ease;
  z-index: 999;
  white-space: nowrap;
}

.toast.show { transform: translateX(-50%) translateY(0); }

/* RESPONSIVE */
@media (max-width: 400px) {
  .map-node .node-name { font-size: 8px; }
  .map-node .node-num  { font-size: 16px; }
  .quiz-q { font-size: 14px; }
}
</style>
</head>
<body>
<div id="app">

  <!-- ══ TITLE SCREEN ══ -->
  <div id="screen-title">
    <div class="title-seal">憲<br>政</div>
    <div class="title-main">政府體制與民主治理</div>
    <div class="title-sub">公民第一冊．第三章</div>
    <div class="title-author">高中公民科｜憲政學院見習謀士</div>
    <div class="divider"></div>
    <div class="title-desc">
      你是「見習謀士小憲」，剛通過公民基礎測驗，踏入傳說中的「憲政學院」。學院設有八道考驗，從憲法的根基出發，歷經三種政府體制的比較，抵達民主治理的前沿。通過全部八關，你將獲得「議政謀士印記」。
    </div>

    <div class="map-section">
      <div class="map-title">─── 八道考驗 ───</div>
      <div class="map-grid" id="map-grid"></div>
    </div>

    <button class="btn-start" onclick="startFromMap()">⚔ 進入考驗</button>
    <button class="btn-home" onclick="goHome()">⌂ 回到首頁</button>
  </div>

  <!-- ══ LEVEL SCREEN ══ -->
  <div id="screen-level" style="display:none"></div>

</div>

<div class="toast" id="toast"></div>

<script>
// ─────────────────────────────────────
// 雲端同步設定
// ─────────────────────────────────────
const API_URL = 'https://script.google.com/macros/s/AKfycbxeJ2XzhzHsYUINJF-Q8wtU7LJFUJBZ6F8l2WxkDIvd8dZuoYougUIXe5fc6g7TX8SeQA/exec';

// ─────────────────────────────────────
// 關卡資料
// ─────────────────────────────────────
const LEVELS = [
  {
    id: 1,
    name: '第一關·憲法的守護',
    narrative: '你踏入憲政學院大廳，守門的長老說：「謀士必先懂憲政根基——知道為何要限制政府，才能成為真正守護人民的智者。」',
    knowledge: `
      <h4>📜 憲政主義核心</h4>
      <ul>
        <li><span class="kw">憲政主義</span>：① 以憲法<strong>限制政府權力</strong>；② 以憲法<strong>保障人民基本權利</strong></li>
        <li><span class="kw">有限政府</span>：政府只能在憲法授權範圍內行使權力，不可逾越</li>
        <li><span class="kw">法律責任</span>：官員違法失職 → 由<strong>司法機關</strong>審判（違法才追究）</li>
        <li><span class="kw">政治責任</span>：政策失誤 → 由<strong>民意機關</strong>課責（不需違法，施政不當即可要求下台）</li>
        <li><span class="kw">塔利班反例</span>：缺乏憲政規範 → 政府濫權，人民無從保障</li>
      </ul>
    `,
    quizzes: [
      {
        q: '憲政主義的核心目的包含哪兩項？',
        opts: ['A. 擴大政府職能以服務人民', 'B. 以憲法限制政府權力，並保障人民基本權利', 'C. 由人民直接決定所有政策', 'D. 讓政府擁有足夠資源應對國家危機'],
        ans: 1,
        exp: '憲政主義 ＝ ①限制政府權力（有限政府）②保障人民基本權利，並非擴大政府職能。'
      },
      {
        q: '某縣長因政策失誤被縣議員提出譴責案、遭選民要求下台，此屬於哪種責任？',
        opts: ['A. 法律責任——違法失職由司法審判', 'B. 行政責任——由上級機關處分', 'C. 政治責任——政策失誤接受民意機關課責', 'D. 道德責任——違反社會倫理規範'],
        ans: 2,
        exp: '接受民意機關監督、被要求下台屬「政治責任」；法律責任需有違法行為才由司法機關處理。'
      },
      {
        q: '阿富汗塔利班政權剝奪女性受教權、任意逮捕平民，反映了哪種政治問題？',
        opts: ['A. 缺乏有效的選舉制度', 'B. 缺乏憲政主義規範，政府濫用權力', 'C. 政府稅收不足，無法提供公共服務', 'D. 地方自治權力過大，造成政治分裂'],
        ans: 1,
        exp: '塔利班案例是「缺乏憲政主義」的反面教材——無憲法限制政府、無司法獨立保障人民。'
      }
    ]
  },
  {
    id: 2,
    name: '第二關·西敏宮的謀士',
    narrative: '第二道考驗傳來英倫的鐘聲。長老說：「內閣制的精妙，在於虛位與實責的分工——你能理解英國首相與女王之間的制度設計嗎？」',
    knowledge: `
      <h4>📜 內閣制三要素</h4>
      <ul>
        <li><span class="kw">虛位元首</span>：國家元首（國王/總統）無政治實權，僅具象徵意義；代表國：英、日、德</li>
        <li><span class="kw">副署制度</span>：元首頒令須經<strong>首相副署</strong>才生效，由首相承擔政治責任（有權有責）</li>
        <li><span class="kw">行政立法融合</span>：閣揆由國會多數黨黨魁出任，閣員通常兼任議員</li>
        <li><span class="kw">倒閣流程</span>：國會通過不信任案 → 內閣總辭 → 首相可呈請解散國會重選</li>
        <li><span class="kw">聯合內閣</span>：無政黨過半時，多黨聯合組閣</li>
      </ul>
    `,
    quizzes: [
      {
        q: '英國女王出席議會宣讀施政報告，但本人不對施政成效負政治責任。這反映了內閣制的哪項特色？',
        opts: ['A. 實權元首——國家元首掌握行政實權', 'B. 虛位元首——國家元首無政治實權，僅具象徵意義', 'C. 雙首長制——元首與閣揆共享行政實權', 'D. 總統制——行政與立法完全分立'],
        ans: 1,
        exp: '內閣制元首是「虛位元首」，施政由首相負責。女王宣讀報告，但政策責任由首相承擔。'
      },
      {
        q: '英國女王頒布法令前，須由首相副署才生效。這項副署制度的主要目的是什麼？',
        opts: ['A. 防止女王簽錯法令', 'B. 讓首相了解女王的決策方向', 'C. 由首相承擔政治責任，落實有權有責的憲政精神', 'D. 加速法令頒布的行政程序'],
        ans: 2,
        exp: '虛位元首無實權也無責，副署讓首相（有實權者）同時承擔責任，落實「有權有責」原則。'
      },
      {
        q: '某內閣制國家，國會以過半多數通過不信任案。首相在必須總辭前，可採取哪項行動？',
        opts: ['A. 宣布戒嚴，暫停國會運作', 'B. 呈請國家元首解散國會，舉行重新選舉', 'C. 提出覆議，要求國會重新審議不信任案', 'D. 直接改選首相，不必向國家元首報告'],
        ans: 1,
        exp: '內閣制倒閣流程：國會通過不信任案 → 內閣總辭；首相在提總辭前可呈請解散國會，交由選民裁決。'
      }
    ]
  },
  {

const STORAGE_KEY = 'c3_progress';

const state = {
  progress: {},   // { 1: '★★★', 2: '★★☆', ... }
  current: null,  // 目前關卡 id
  answers: [],    // 目前作答狀況
  quizIdx: 0,     // 目前題目索引
};

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state.progress = JSON.parse(raw);
  } catch { state.progress = {}; }
}

function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress));
}

function isUnlocked(id) {
  if (id === 1) return true;
  return !!state.progress[id - 1];
}

function getStars(correct, total) {
  const pct = correct / total;
  if (pct === 1) return '★★★';
  if (pct >= 0.67) return '★★☆';
  if (pct >= 0.6)  return '★☆☆';
  return '';
}

    const node = document.createElement('div');
    const stars = state.progress[lv.id] || '';
    const locked = !isUnlocked(lv.id);
    let cls = locked ? 'locked' : 'unlocked';
    if (stars === '★☆☆') cls = 'done-1';
    if (stars === '★★☆') cls = 'done-2';
    if (stars === '★★★') cls = 'done-3';

    node.className = `map-node ${cls}`;

    const shortName = lv.name.replace(/第.關·/, '');
    if (locked) {
      node.innerHTML = `<div class="node-lock">🔒</div><div class="node-name">${shortName}</div>`;
    } else {
      node.innerHTML = `
        <div class="node-num">${lv.id}</div>
        <div class="node-name">${shortName}</div>
        ${stars ? `<div class="node-stars">${stars}</div>` : ''}
      `;
      node.onclick = () => startLevel(lv.id);
    }
    grid.appendChild(node);
  });
}

// ─────────────────────────────────────
// 起點
// ─────────────────────────────────────
function startFromMap() {
  const firstUnplayed = LEVELS.find(lv => isUnlocked(lv.id) && !state.progress[lv.id]);
  const id = firstUnplayed ? firstUnplayed.id : 1;
  startLevel(id);
}

// ─────────────────────────────────────
// 關卡畫面
// ─────────────────────────────────────
function startLevel(id) {
  const lv = LEVELS.find(l => l.id === id);
  if (!lv || !isUnlocked(id)) return;

  state.current = id;
  state.answers = new Array(lv.quizzes.length).fill(null);
  state.quizIdx = 0;

  showLevelScreen(lv);
}

function showLevelScreen(lv) {
  document.getElementById('screen-title').style.display = 'none';
  const scr = document.getElementById('screen-level');
  scr.style.display = 'block';
  renderLevel(lv);
}

function renderLevel(lv) {
  const scr = document.getElementById('screen-level');
  const answered = state.answers.filter(a => a !== null).length;
  const pct = answered / lv.quizzes.length;

  scr.innerHTML = `
    <div class="level-header">
      <div class="level-badge">${lv.name.split('·')[0]}</div>
      <div class="level-name">${lv.name.split('·')[1] || ''}</div>
      <div class="level-prog">${answered}/${lv.quizzes.length} 題</div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" style="width:${pct * 100}%"></div>
    </div>
    <div class="narrative-box">${lv.narrative}</div>
    <div class="knowledge-card">${lv.knowledge}</div>
    ${lv.quizzes.map((q, i) => renderQuiz(q, i)).join('')}
    <div id="submit-area" style="margin-top:16px"></div>
  `;

  updateSubmitArea(lv);
}

function renderQuiz(q, idx) {
  const ans = state.answers[idx];
  const answered = ans !== null;
  const optsHtml = q.opts.map((opt, i) => {
    let cls = '';
    if (answered) {
      if (i === q.ans) cls = 'correct';
      else if (i === ans && i !== q.ans) cls = 'wrong';
    }
    return `<button class="opt-btn ${cls}" ${answered ? 'disabled' : ''}
      onclick="selectAnswer(${idx}, ${i})">${opt}</button>`;
  }).join('');

  return `
    <div class="quiz-card" id="quiz-${idx}">
      <div class="quiz-num">第 ${idx + 1} 題 / 共 ${LEVELS.find(l => l.id === state.current).quizzes.length} 題</div>
      <div class="quiz-q">${q.q}</div>
      <div class="opts-list">${optsHtml}</div>
      <div class="exp-box ${answered ? 'show' : ''}" id="exp-${idx}">
        <span class="exp-icon">${ans === q.ans ? '✅' : '❌'}</span>${q.exp}
      </div>
    </div>
  `;
}

function selectAnswer(quizIdx, optIdx) {
  if (state.answers[quizIdx] !== null) return;

  state.answers[quizIdx] = optIdx;
  const lv = LEVELS.find(l => l.id === state.current);

  // 更新按鈕樣式
  const quiz = lv.quizzes[quizIdx];
  const card = document.getElementById(`quiz-${quizIdx}`);
  const btns = card.querySelectorAll('.opt-btn');

  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === quiz.ans) btn.classList.add('correct');
    else if (i === optIdx && i !== quiz.ans) btn.classList.add('wrong');
  });

  document.getElementById(`exp-${quizIdx}`).classList.add('show');
  document.getElementById(`exp-${quizIdx}`).querySelector('.exp-icon').textContent =
    optIdx === quiz.ans ? '✅ ' : '❌ ';

  // 更新進度條
  const answered = state.answers.filter(a => a !== null).length;
  const pct = answered / lv.quizzes.length;
  document.querySelector('.progress-bar-fill').style.width = (pct * 100) + '%';
  document.querySelector('.level-prog').textContent = `${answered}/${lv.quizzes.length} 題`;

  updateSubmitArea(lv);
}

function updateSubmitArea(lv) {
  const area = document.getElementById('submit-area');
  if (!area) return;
  const allAnswered = state.answers.every(a => a !== null);
  if (allAnswered) {
    area.innerHTML = `<button class="btn-next" onclick="showComplete()">查看結果 →</button>`;
  } else {
    const unanswered = state.answers.filter(a => a === null).length;
    area.innerHTML = `<div style="text-align:center;color:#5a8a7a;font-size:13px;padding:8px">
      還有 ${unanswered} 題待作答</div>`;
  }
}

// ─────────────────────────────────────
// 完關畫面
// ─────────────────────────────────────
function showComplete() {
  const lv = LEVELS.find(l => l.id === state.current);
  const correct = state.answers.filter((a, i) => a === lv.quizzes[i].ans).length;
  const total = lv.quizzes.length;
  const pct = correct / total;
  const stars = getStars(correct, total);
  const passed = pct >= 0.6;

  if (passed) {
    state.progress[lv.id] = stars;
    saveProgress();
    syncToCloud();
  }

  const scr = document.getElementById('screen-level');
  const nextId = lv.id + 1;
  const hasNext = LEVELS.find(l => l.id === nextId);
  const allDone = Object.keys(state.progress).length >= LEVELS.length;

  if (allDone && passed) {
    showFinalComplete();
    return;
  }

  scr.innerHTML = `
    <div class="complete-card">
      <div class="complete-stars">${stars || '─'}</div>
      <div class="complete-title">${lv.name}</div>
      <div class="complete-score">${Math.round(pct * 100)}%</div>
      <div class="score-detail">
        <div class="score-item">
          <span class="score-label">答對</span>
          <span class="score-val">${correct}</span>
        </div>
        <div class="score-item">
          <span class="score-label">答錯</span>
          <span class="score-val">${total - correct}</span>
        </div>
        <div class="score-item">
          <span class="score-label">總題</span>
          <span class="score-val">${total}</span>
        </div>
      </div>
      <div class="complete-msg">
        ${passed
          ? (stars === '★★★' ? '完美！滿分通關，謀士之資！' : '通關成功！繼續前進吧。')
          : `未達60%，需重新作答（需 ${Math.ceil(total * 0.6)} 題答對）`}
      </div>
      ${passed && hasNext
        ? `<button class="btn-next" onclick="startLevel(${nextId})">進入 ${hasNext.name} →</button>`
        : ''}
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px">
        <button class="btn-retry" onclick="startLevel(${lv.id})">↺ 重新挑戰</button>
        <button class="btn-map" onclick="showTitleScreen()">⊞ 關卡地圖</button>
      </div>
    </div>
  `;
}

function showFinalComplete() {
  const totalStars = Object.values(state.progress).reduce((sum, s) => sum + (s.split('★').length - 1), 0);
  const maxStars = LEVELS.length * 3;

  const scr = document.getElementById('screen-level');
  scr.innerHTML = `
    <div class="final-card">
      <div class="final-seal">議<br>政<br>謀<br>士</div>
      <div class="final-title">議政謀士印記</div>
      <div class="stars-row">${Object.values(state.progress).join(' ')}</div>
      <div class="final-desc">
        恭喜！你通過了憲政學院的八道考驗，從憲政主義的根基出發，掌握三種政府體制的精髓，深入理解我國雙首長制的機制，並觸及民主治理的前沿。「議政謀士印記」正式授予你！
      </div>
      <div style="font-size:13px;color:#5a8a7a;margin-bottom:16px">
        總得星：${totalStars} / ${maxStars} ★
      </div>
      <button class="btn-map" onclick="showTitleScreen()">⊞ 回到關卡地圖</button>
      <button class="btn-home" onclick="goHome()">⌂ 回到首頁</button>
    </div>
  `;
}

// ─────────────────────────────────────
// 畫面切換
// ─────────────────────────────────────
function showTitleScreen() {
  document.getElementById('screen-level').style.display = 'none';
  document.getElementById('screen-title').style.display = 'block';
  renderMap();
  window.scrollTo(0, 0);
}

// ─────────────────────────────────────
// Toast 提示
// ─────────────────────────────────────
function showToast(msg, duration = 2000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

// ─────────────────────────────────────
// 雲端同步
// ─────────────────────────────────────
async function syncToCloud() {
  const STUDENT_KEY = 'hc_student';
  let s;
  try { s = JSON.parse(localStorage.getItem(STUDENT_KEY) || 'null'); }
  catch { return { ok: false, reason: 'no_student' }; }
  if (!s || !s.id) return { ok: false, reason: 'no_student' };
  if (!API_URL || API_URL === 'YOUR_APPS_SCRIPT_URL_HERE') return { ok: false, reason: 'no_url' };

  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try {
    const params = new URLSearchParams({
      action : 'set',
      id     : s.id,
      name   : s.name || '',
      c3     : localStorage.getItem(STORAGE_KEY) || '{}',
      t      : Date.now()
    });
    const res  = await fetch(API_URL + '?' + params.toString(), { signal: ctrl.signal });
    clearTimeout(timer);
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch { return { ok: false, reason: 'bad_json', detail: text.slice(0, 120) }; }
    return data.ok ? { ok: true } : { ok: false, reason: 'server_err', detail: data.error || '' };
  } catch (err) {
    clearTimeout(timer);
    if (err.name === 'AbortError') return { ok: false, reason: 'timeout' };
    if (!navigator.onLine)        return { ok: false, reason: 'offline' };
    return { ok: false, reason: 'network', detail: err.message };
  }
}

function syncErrMsg(r) {
  if (r.reason === 'timeout')     return '連線逾時，進度已存本機';
  if (r.reason === 'offline')     return '裝置離線，進度已存本機';
  if (r.reason === 'no_student')  return '請先在首頁登入';
  if (r.reason === 'bad_json')    return 'Apps Script 回應異常：' + (r.detail || '');
  if (r.reason === 'server_err')  return 'Apps Script 錯誤：' + (r.detail || '未知');
  return '同步失敗（' + (r.detail || r.reason) + '）';
}

async function goHome() {
  const btn = document.querySelector('.btn-home');
  if (btn) { btn.textContent = '⏳ 同步中…'; btn.disabled = true; }
  const result = await syncToCloud();
  if (result.ok) {
    if (btn) btn.textContent = '✓ 已存檔';
    await new Promise(r => setTimeout(r, 600));
  } else if (result.reason === 'no_student' || result.reason === 'no_url') {
    if (btn) btn.textContent = '→ 返回首頁';
    await new Promise(r => setTimeout(r, 400));
  } else {
    const msg = syncErrMsg(result);
    if (btn) btn.textContent = '⚠ 同步失敗';
    showToast(msg, 3000);
    await new Promise(r => setTimeout(r, 3200));
  }
  window.location.href = 'index.html';
}

// ─────────────────────────────────────
// 初始化
// ─────────────────────────────────────
loadProgress();
renderMap();
</script>
