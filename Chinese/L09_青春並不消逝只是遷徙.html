<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青春並不消逝，只是遷徙｜時光迴廊的記憶使者</title>
<style>
  :root {
    --ink: #1c1008;
    --parchment: #f4e8cc;
    --parchment-dark: #e8d4a8;
    --red: #8b1a1a;
    --gold: #b8860b;
    --gold-light: #daa520;
    --jade: #2d6a4f;
    --mist: #c8d8c8;
    --shadow: rgba(28,16,8,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', 'Noto Serif TC', serif;
    background: #1c1008;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 680px;
    min-height: 100vh;
    background: var(--parchment);
    background-image:
      radial-gradient(ellipse at top, #f9f0dc 0%, var(--parchment) 60%),
      repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(180,150,80,0.06) 29px);
    position: relative;
    overflow: hidden;
  }

  /* ── decorative border ── */
  #app::before {
    content: '';
    position: fixed;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 680px;
    height: 100%; pointer-events: none; z-index: 999;
    border: 3px solid var(--gold);
    box-shadow: inset 0 0 0 6px rgba(184,134,11,0.15);
  }

  /* ══ TITLE SCREEN ══ */
  #screen-title {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; padding: 40px 24px; text-align: center;
  }
  .title-seal {
    width: 88px; height: 88px;
    border: 3px solid var(--red);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; color: var(--red);
    margin-bottom: 24px;
    box-shadow: 2px 2px 0 var(--red), inset 0 0 8px rgba(139,26,26,0.12);
    letter-spacing: 2px;
    writing-mode: vertical-rl;
    font-weight: bold;
  }
  .title-main {
    font-size: 26px; font-weight: bold;
    color: var(--red); letter-spacing: 4px;
    margin-bottom: 8px; line-height: 1.4;
  }
  .title-sub {
    font-size: 13px; color: var(--gold);
    letter-spacing: 3px; margin-bottom: 6px;
  }
  .title-author {
    font-size: 13px; color: #666;
    margin-bottom: 32px; letter-spacing: 2px;
  }
  .divider {
    width: 180px; height: 1px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    margin: 16px auto;
  }
  .title-desc {
    font-size: 14px; line-height: 1.9; color: #444;
    max-width: 380px; margin-bottom: 36px;
  }
  .map-grid {
    display: grid; grid-template-columns: repeat(5,1fr);
    gap: 10px; width: 100%; max-width: 360px; margin-bottom: 32px;
  }
  .map-node {
    aspect-ratio: 1;
    border: 1.5px solid var(--gold);
    border-radius: 4px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 10px; color: #888;
    cursor: pointer; transition: all .2s;
    background: rgba(255,255,255,0.4);
    padding: 2px;
    text-align: center; line-height: 1.2;
  }
  .map-node.unlocked { color: var(--ink); background: rgba(255,255,255,0.7); cursor: pointer; }
  .map-node.unlocked:hover { background: #fff; border-color: var(--red); color: var(--red); }
  .map-node.completed { background: var(--jade); border-color: var(--jade); color: #fff; }
  .map-node.locked { opacity: .45; cursor: not-allowed; }
  .map-node .node-num { font-size: 14px; font-weight: bold; margin-bottom: 2px; }
  .btn-start {
    background: var(--red); color: #fff;
    border: none; padding: 14px 48px;
    font-size: 16px; letter-spacing: 4px;
    cursor: pointer; font-family: inherit;
    border-radius: 2px;
    box-shadow: 3px 3px 0 #5a0000;
    transition: all .15s;
  }
  .btn-start:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 #5a0000; }
  .btn-start:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 #5a0000; }
  .btn-home {
    margin-top: 12px;
    background: none; border: 1.5px solid rgba(139,26,26,0.35);
    color: var(--red); padding: 9px 32px;
    font-size: 13px; letter-spacing: 3px;
    cursor: pointer; font-family: inherit; border-radius: 2px;
    transition: all .15s;
  }
  .btn-home:hover { background: rgba(139,26,26,0.07); border-color: var(--red); }

  /* ══ LEVEL SCREEN ══ */
  #screen-level { display: none; min-height: 100vh; padding-bottom: 40px; }
  .level-header {
    background: var(--red);
    padding: 16px 20px 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .level-header-left { display: flex; align-items: center; gap: 12px; }
  .level-badge {
    width: 36px; height: 36px;
    border: 2px solid rgba(255,255,255,0.6);
    border-radius: 3px; display: flex;
    align-items: center; justify-content: center;
    color: #fff; font-size: 14px; font-weight: bold;
  }
  .level-title-text { color: #fff; }
  .level-title-text .lv-num { font-size: 11px; opacity: .8; letter-spacing: 2px; }
  .level-title-text .lv-name { font-size: 16px; font-weight: bold; letter-spacing: 2px; }
  .btn-back {
    background: none; border: 1.5px solid rgba(255,255,255,0.5);
    color: #fff; padding: 6px 14px;
    font-size: 12px; cursor: pointer; font-family: inherit;
    letter-spacing: 1px; border-radius: 2px;
  }
  .progress-bar-wrap { height: 5px; background: var(--parchment-dark); }
  .progress-bar { height: 100%; background: var(--gold); transition: width .4s; }

  /* ── sections ── */
  .section { padding: 24px 20px; }
  .section + .section { border-top: 1px dashed rgba(184,134,11,0.3); }
  .section-tag {
    display: inline-block; font-size: 11px; letter-spacing: 3px;
    color: #fff; background: var(--gold); padding: 2px 10px;
    margin-bottom: 14px;
  }
  .section-tag.red { background: var(--red); }
  .section-tag.jade { background: var(--jade); }

  /* narrative */
  .narrative-box {
    background: rgba(255,255,255,0.55);
    border-left: 3px solid var(--gold);
    padding: 16px 18px; font-size: 15px;
    line-height: 2; color: #2a1a00;
    border-radius: 0 4px 4px 0;
  }
  .narrative-box .npc-name {
    font-size: 12px; color: var(--gold);
    letter-spacing: 2px; margin-bottom: 8px;
    display: block;
  }

  /* knowledge card */
  .knowledge-card {
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--gold-light);
    border-radius: 4px; padding: 16px 18px;
    font-size: 14px; line-height: 1.9;
  }
  .knowledge-card h4 {
    color: var(--red); font-size: 14px;
    letter-spacing: 2px; margin-bottom: 10px;
    padding-bottom: 6px; border-bottom: 1px solid rgba(184,134,11,0.3);
  }
  .knowledge-card ul { padding-left: 18px; }
  .knowledge-card li { margin-bottom: 6px; }
  .knowledge-card .kw { color: var(--red); font-weight: bold; }
  .knowledge-card table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  .knowledge-card th {
    background: rgba(184,134,11,0.15);
    padding: 6px 8px; text-align: left;
    border: 1px solid rgba(184,134,11,0.3);
    font-weight: normal; letter-spacing: 1px;
  }
  .knowledge-card td {
    padding: 6px 8px; border: 1px solid rgba(184,134,11,0.2);
    vertical-align: top;
  }
  .quote-box {
    background: rgba(45,106,79,0.08);
    border: 1px dashed var(--jade);
    border-radius: 4px; padding: 12px 16px;
    font-size: 14px; line-height: 1.9;
    margin-top: 10px; color: #1a3a2a;
  }

  /* quiz */
  .quiz-wrap { display: flex; flex-direction: column; gap: 28px; }
  .quiz-item {}
  .quiz-q {
    font-size: 15px; line-height: 1.8;
    margin-bottom: 14px; color: var(--ink);
    font-weight: bold;
  }
  .quiz-q .q-num {
    display: inline-block; width: 24px; height: 24px;
    background: var(--red); color: #fff;
    font-size: 12px; border-radius: 2px;
    text-align: center; line-height: 24px;
    margin-right: 8px; font-weight: normal;
  }
  .choices { display: flex; flex-direction: column; gap: 8px; }
  .choice-btn {
    background: rgba(255,255,255,0.7);
    border: 1.5px solid rgba(184,134,11,0.4);
    padding: 12px 16px; font-size: 14px;
    line-height: 1.6; cursor: pointer;
    font-family: inherit; text-align: left;
    border-radius: 3px; transition: all .15s;
    color: var(--ink);
  }
  .choice-btn:hover:not(:disabled) {
    border-color: var(--gold); background: rgba(255,255,255,0.9);
  }
  .choice-btn.correct {
    background: rgba(45,106,79,0.15);
    border-color: var(--jade); color: var(--jade);
  }
  .choice-btn.wrong {
    background: rgba(139,26,26,0.1);
    border-color: var(--red); color: var(--red);
  }
  .choice-btn:disabled { cursor: default; }
  .feedback-box {
    margin-top: 10px; padding: 12px 14px;
    font-size: 13px; line-height: 1.7;
    border-radius: 3px; display: none;
  }
  .feedback-box.correct {
    background: rgba(45,106,79,0.1);
    border-left: 3px solid var(--jade);
    color: var(--jade); display: block;
  }
  .feedback-box.wrong {
    background: rgba(139,26,26,0.08);
    border-left: 3px solid var(--red);
    color: #8b1a1a; display: block;
  }

  /* level complete */
  .level-complete {
    display: none; text-align: center;
    padding: 32px 20px;
  }
  .complete-seal {
    width: 100px; height: 100px;
    border: 3px solid var(--jade);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; margin: 0 auto 20px;
    color: var(--jade); writing-mode: vertical-rl;
    font-weight: bold; letter-spacing: 2px;
    box-shadow: 3px 3px 0 rgba(45,106,79,0.3);
  }
  .complete-title { font-size: 20px; color: var(--jade); letter-spacing: 3px; margin-bottom: 8px; }
  .complete-score { font-size: 14px; color: #666; margin-bottom: 24px; }
  .btn-next {
    background: var(--jade); color: #fff;
    border: none; padding: 14px 40px;
    font-size: 15px; letter-spacing: 3px;
    cursor: pointer; font-family: inherit;
    border-radius: 2px; box-shadow: 3px 3px 0 #1a4a2f;
    margin: 8px; transition: all .15s;
  }
  .btn-next:hover { transform: translate(-1px,-1px); }
  .btn-submit {
    background: var(--red); color: #fff;
    border: none; padding: 13px 36px;
    font-size: 14px; letter-spacing: 3px;
    cursor: pointer; font-family: inherit;
    border-radius: 2px; box-shadow: 2px 2px 0 #5a0000;
    margin-top: 20px; display: block; width: 100%;
    transition: all .15s;
  }
  .btn-submit:hover { opacity: .9; }
  .btn-submit:disabled { opacity: .5; cursor: not-allowed; }

  .stars { font-size: 28px; margin-bottom: 8px; }
  em { color: var(--red); font-style: normal; font-weight: bold; }

  @media (max-width: 420px) {
    .title-main { font-size: 22px; }
    .knowledge-card { font-size: 13px; }
    .quiz-q { font-size: 14px; }
    .choice-btn { font-size: 13px; padding: 10px 12px; }
  }
</style>
</head>
<body>
<div id="app">

<!-- ══ TITLE SCREEN ══ -->
<div id="screen-title">
  <div class="title-seal">青春</div>
  <div class="title-main">青春並不消逝<br>只是遷徙</div>
  <div class="title-sub">時光迴廊的記憶使者</div>
  <div class="title-author">張曼娟｜高中國文第二冊第九課</div>
  <div class="divider"></div>
  <div class="title-desc">
    你化身為一位「記憶使者」，<br>
    受命進入古老的時光迴廊，<br>
    拼湊一位老師十五年的生命碎片。<br>
    穿越歲月長河，方能領悟<br>「青春遷徙」的真義，<br>
    獲得「歲月慈悲」的神印。
  </div>
  <div class="map-grid" id="map-grid"></div>
  <button class="btn-start" onclick="startFromMap()">開始冒險</button>
  <button class="btn-home"  onclick="goHome()">⌂ 回到首頁</button>
</div>

<!-- ══ LEVEL SCREEN ══ -->
<div id="screen-level">
  <div class="level-header">
    <div class="level-header-left">
      <div class="level-badge" id="lv-badge">01</div>
      <div class="level-title-text">
        <div class="lv-num" id="lv-num-text">第一關</div>
        <div class="lv-name" id="lv-name-text"></div>
      </div>
    </div>
    <button class="btn-back" onclick="goTitle()">◀ 地圖</button>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar"></div></div>
  <div id="level-content"></div>
</div>

</div><!-- #app -->

<script>
// ══════════════════════════════════════════════
//  GAME DATA
// ══════════════════════════════════════════════
const LEVELS = [
{
  id: 1,
  name: '使者受命·踏入迴廊',
  tag: '第一關',
  narrative: `【長老】\n古廟大門緊閉，石獸沉默守立兩旁。\n\n一位白髮長老緩步走來，聲若洪鐘：\n\n「使者，時光迴廊已久久封印。迴廊中封存著一位女子的記憶——她以文字為劍，以歲月為師，一生橫跨學院與人間。要解開封印，先告訴我，你對她了解多少？」\n\n長老緩緩攤開一卷泛黃的羊皮書，等待你的回答。`,
  knowledge: {
    title: '張曼娟其人其事',
    content: `<ul>
      <li><span class="kw">生卒</span>：1961年生，臺灣當代作家、學者</li>
      <li><span class="kw">職位</span>：東吳大學教授（2005年以現代小說創作升等，臺灣首位）</li>
      <li><span class="kw">25歲</span>：出版《海水正藍》，登暢銷榜，掀起「張曼娟現象」</li>
      <li><span class="kw">創作特色</span>：散文為主，古典與現代交融，詩化意象，題材由個人內心逐步向外擴展</li>
      <li><span class="kw">代表作</span>：《海水正藍》《青春》《女兒紅》《誰在銀閃閃的地方，等你》</li>
      <li><span class="kw">本課出處</span>：〈青春並不消逝，只是遷徙〉，收錄於散文集《青春》</li>
    </ul>
    <div class="quote-box">💡 <em>「紫石作坊」</em>（1996年創立）是台灣第一個文學創作工作室；<em>「張曼娟小學堂」</em>（2005年創立）以私塾模式推廣文學教育。</div>`
  },
  quizzes: [
    {
      q: '張曼娟以什麼身分在東吳大學升等為教授？這在臺灣學術界具有什麼特殊意義？',
      choices: [
        '以電影劇本創作升等，是首位以影視作品升等的學者',
        '以現代小說創作升等，是臺灣首位以此途徑升等的學者',
        '以散文評論研究升等，開創了文學批評升等的先例',
        '以古典文學論文升等，結合學術與創作雙重成就'
      ],
      answer: 1,
      feedback: '正確！張曼娟在2005年以<em>現代小說創作</em>（非電影、非學術論文）升等教授，開創了台灣學術界的先例，意義重大。'
    },
    {
      q: '下列哪一項描述最符合張曼娟的創作風格？',
      choices: [
        '以政治批判為主軸，文風犀利辛辣，直指社會弊病',
        '以鄉土寫實為基調，描摹台灣農村生活的真實樣貌',
        '古典與現代交融，善用詩化意象，題材由個人心靈向外擴展',
        '以科幻想像為特色，結合歷史典故與未來敘事'
      ],
      answer: 2,
      feedback: '正確！張曼娟的風格是「<em>古典與現代交融、詩化意象</em>」，題材由自我心靈向外拓展至社會、歷史、生老病死等面向。'
    },
    {
      q: '〈青春並不消逝，只是遷徙〉收錄於哪一部散文集？',
      choices: ['《海水正藍》', '《水問》', '《青春》', '《女兒紅》'],
      answer: 2,
      feedback: '正確！本課出自散文集<em>《青春》</em>，以青春、生命無常、歲月為核心主題。'
    }
  ]
},
{
  id: 2,
  name: '秘閣尋典·文體秘笈',
  tag: '第二關',
  narrative: `【古籍閣守衛】\n穿過廟門，眼前是一座堆滿卷軸的古籍閣。\n\n一道金色封印橫亙在最高層書架前，守衛冷聲開口：\n\n「此閣收藏的，是遊走於散文與小說之間的秘笈——<em>小說體散文</em>。你若分不清它與普通散文的差異，便取不走這卷軸。」\n\n封印嗡嗡作響，等待破解。`,
  knowledge: {
    title: '小說體散文｜四大秘笈',
    content: `<table>
      <tr><th>比較項目</th><th>傳統散文</th><th>小說體散文</th></tr>
      <tr><td>內容真實性</td><td>強調真實</td><td>真實體驗為基礎</td></tr>
      <tr><td>結構</td><td>較鬆散，隨筆式</td><td>有意識安排起承轉合</td></tr>
      <tr><td>人物塑造</td><td>較淡化</td><td>立體鮮明，有心理描寫</td></tr>
      <tr><td>讀起來的感受</td><td>如讀日記或雜感</td><td>如讀短篇小說</td></tr>
    </table>
    <div class="quote-box">
      <b>四大特徵：</b><br>
      ①&nbsp;<em>情節的鋪陳與營造</em>——有懸念、伏筆、高潮<br>
      ②&nbsp;<em>人物的刻劃與塑造</em>——對話、行動、心理描寫精心設計<br>
      ③&nbsp;<em>場景的描寫與渲染</em>——細膩描摹氛圍，有如身歷其境<br>
      ④&nbsp;<em>敘事結構的安排</em>——雙線交織、時空跳接、今昔對比
    </div>`
  },
  quizzes: [
    {
      q: '關於「小說體散文」，下列何項描述最為精確？',
      choices: [
        '完全虛構人物與情節，但以散文形式書寫，追求藝術美感',
        '以真實體驗為基礎，運用小說手法（情節、人物、場景）使散文具故事張力',
        '以學術論文為架構，穿插個人散文式抒情，為現代文體新創',
        '本質上是小說，為迴避版權而偽裝成散文'
      ],
      answer: 1,
      feedback: '正確！小說體散文的核心定義：<em>真實體驗為基礎（散文本質）+ 小說創作手法（藝術形式）</em>，兩者缺一不可。'
    },
    {
      q: '本課「第二段幼子形象」照應「第六、七段青年形象」，這是小說體散文哪項特徵的具體展現？',
      choices: [
        '情節的鋪陳與營造（伏筆與照應）',
        '場景的描寫與渲染（氛圍烘托）',
        '人物的刻劃與塑造（心理描寫）',
        '傳統散文的隨筆特性'
      ],
      answer: 0,
      feedback: '正確！幼子→青年的前後照應，正是<em>情節的鋪陳與營造</em>中「伏筆」技法的展現，製造閱讀時的驚喜感。'

const state = {
  progress: JSON.parse(localStorage.getItem('l09_progress') || '{}'),
  currentLevel: 0,
  answered: {},
  correctCount: 0
};
function saveProgress() {
  localStorage.setItem('l09_progress', JSON.stringify(state.progress));
}

const API_URL = 'https://script.google.com/macros/s/AKfycbyrFmS6A76XEJ1wWt13bggLGNX7TT4ba-20OinoewmGjcK49YSy6Zj3asEwb4fWh1Kx9A/exec';
async function syncToCloud() {
  const STUDENT_KEY = 'hc2_student';
  let s;
  try { s = JSON.parse(localStorage.getItem(STUDENT_KEY) || 'null'); } catch { return false; }
  if (!s || !s.id) return false;
  try {
    const params = new URLSearchParams({
      action : 'set',
      id     : s.id,
      name   : s.name || '',
      l09    : localStorage.getItem('l09_progress') || '{}',
      l10    : localStorage.getItem('l10_progress') || '{}',
      l11    : localStorage.getItem('l11_progress') || '{}',
      t      : Date.now()
    });
    const res  = await fetch(API_URL + '?' + params.toString());
    const data = await res.json();
    return data.ok;
  } catch (e) { return false; }
}

function isUnlocked(id) { return id === 1 || !!state.progress[(id-1)]; }
function isCompleted(id) { return !!state.progress[id]; }

// ══════════════════════════════════════════════
//  MAP RENDER
// ══════════════════════════════════════════════
function renderMap() {
  const grid = document.getElementById('map-grid');
  grid.innerHTML = '';
  LEVELS.forEach(lv => {
    const node = document.createElement('div');
    const done = isCompleted(lv.id);
    const open = isUnlocked(lv.id);
    node.className = 'map-node ' + (done ? 'completed' : open ? 'unlocked' : 'locked');
    node.innerHTML = `<div class="node-num">${done ? '✓' : lv.id}</div><div style="font-size:9px;line-height:1.2">${lv.name.split('·')[1] || lv.name}</div>`;
    if (open) node.onclick = () => startLevel(lv.id);
    grid.appendChild(node);
  });
}

function startFromMap() {
  // find first incomplete unlocked
  let target = 1;
  for (let i = 1; i <= LEVELS.length; i++) {
    if (!isCompleted(i) && isUnlocked(i)) { target = i; break; }
  }
  startLevel(target);
}

// ══════════════════════════════════════════════
//  LEVEL
// ══════════════════════════════════════════════
function startLevel(id) {
  const lv = LEVELS.find(l => l.id === id);
  if (!lv) return;
  state.currentLevel = id;
  state.answered = {};
  state.correctCount = 0;

  document.getElementById('screen-title').style.display = 'none';
  document.getElementById('screen-level').style.display = 'block';
  document.getElementById('lv-badge').textContent = String(id).padStart(2,'0');
  document.getElementById('lv-num-text').textContent = lv.tag;
  document.getElementById('lv-name-text').textContent = lv.name;
  document.getElementById('progress-bar').style.width = '0%';

  const content = document.getElementById('level-content');
  content.innerHTML = buildLevelHTML(lv);
  window.scrollTo(0,0);
}

function buildLevelHTML(lv) {
  // Format narrative
  const narr = lv.narrative.replace(/\n/g,'<br>').replace(/【(.+?)】/g,'<span class="npc-name">【$1】</span>');

  let quizHTML = '';
  lv.quizzes.forEach((q, qi) => {
    const choices = q.choices.map((c, ci) =>
      `<button class="choice-btn" onclick="answerQ(${lv.id},${qi},${ci})" id="c${lv.id}_${qi}_${ci}">${String.fromCharCode(65+ci)}. ${c}</button>`
    ).join('');
    quizHTML += `
      <div class="quiz-item" id="qi_${lv.id}_${qi}">
        <div class="quiz-q"><span class="q-num">${qi+1}</span>${q.q}</div>
        <div class="choices">${choices}</div>
        <div class="feedback-box" id="fb_${lv.id}_${qi}"></div>
      </div>`;
  });

  return `
    <div class="section">
      <div class="section-tag">情境導引</div>
      <div class="narrative-box">${narr}</div>
    </div>
    <div class="section">
      <div class="section-tag red">核心教學</div>
      <div class="knowledge-card">
        <h4>📜 ${lv.knowledge.title}</h4>
        ${lv.knowledge.content}
      </div>
    </div>
    <div class="section">
      <div class="section-tag jade">冒險挑戰</div>
      <div class="quiz-wrap">${quizHTML}</div>
    </div>
    <div class="level-complete" id="lc_${lv.id}">
      <div class="complete-seal">通關</div>
      <div class="stars" id="stars_${lv.id}">★★★</div>
      <div class="complete-title">關卡通關！</div>
      <div class="complete-score" id="lc_score_${lv.id}"></div>
      <button class="btn-next" onclick="goTitle()">返回地圖</button>
      ${lv.id < LEVELS.length ? `<button class="btn-next" onclick="startLevel(${lv.id+1})">下一關 ▶</button>` : ''}
    </div>`;
}

function answerQ(lvId, qi, ci) {
  if (state.answered[qi] !== undefined) return;
  const lv = LEVELS.find(l => l.id === lvId);
  const q = lv.quizzes[qi];
  const correct = ci === q.answer;

  state.answered[qi] = correct;
  if (correct) state.correctCount++;

  // style buttons
  for (let i = 0; i < q.choices.length; i++) {
    const btn = document.getElementById(`c${lvId}_${qi}_${i}`);
    btn.disabled = true;
    if (i === q.answer) btn.classList.add('correct');
    else if (i === ci && !correct) btn.classList.add('wrong');
  }

  // feedback
  const fb = document.getElementById(`fb_${lvId}_${qi}`);
  fb.className = 'feedback-box ' + (correct ? 'correct' : 'wrong');
  fb.innerHTML = (correct ? '✓ ' : '✗ ') + q.feedback;

  // update progress bar
  const total = lv.quizzes.length;
  const done = Object.keys(state.answered).length;
  document.getElementById('progress-bar').style.width = (done/total*100) + '%';

  // check if all answered
  if (done === total) setTimeout(() => showComplete(lvId), 600);
}

function showComplete(lvId) {
  const lv = LEVELS.find(l => l.id === lvId);
  const total = lv.quizzes.length;
  const correct = state.correctCount;
  const pct = correct / total;
  const stars = pct === 1 ? '★★★' : pct >= 0.6 ? '★★☆' : '★☆☆';

  document.getElementById(`lc_${lvId}`).style.display = 'block';
  document.getElementById(`stars_${lvId}`).textContent = stars;
  document.getElementById(`lc_score_${lvId}`).textContent =
    `答對 ${correct} / ${total} 題　${Math.round(pct*100)} 分`;

  if (pct >= 0.6) {
    state.progress[lvId] = stars;
    saveProgress();
    syncToCloud();
  }
  document.getElementById(`lc_${lvId}`).scrollIntoView({behavior:'smooth'});
}

async function goHome() {
  const btn = document.querySelector('.btn-home');
  if (btn) { btn.textContent = '⏳ 同步中…'; btn.disabled = true; }
  const ok = await syncToCloud();
  if (btn) btn.textContent = ok ? '✓ 已存檔' : '（本機模式）';
  await new Promise(r => setTimeout(r, 700));
  window.location.href = 'index.html';
}

function goTitle() {
  document.getElementById('screen-level').style.display = 'none';
  document.getElementById('screen-title').style.display = 'flex';
  renderMap();
}

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
renderMap();
</script>
</body>
