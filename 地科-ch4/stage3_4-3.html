<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>變動的大氣 第三關 — 大氣的運動</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: linear-gradient(180deg, #1a2530 0%, #2c4a6b 35%, #5a7fa0 100%);
    min-height: 100vh; color: #fff; padding: 20px; }
  .game { max-width: 760px; margin: 0 auto; background: rgba(255,255,255,0.96); color: #222; border-radius: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); overflow: hidden; }
  header { background: #2c4a6b; color: #fff; padding: 16px 24px; }
  header h1 { margin: 0; font-size: 22px; }
  header .sub { font-size: 13px; opacity: 0.85; margin-top: 4px; }
  .status { display: flex; gap: 16px; padding: 12px 24px; background: #f3f6fb; border-bottom: 1px solid #dde3ec; font-size: 14px; flex-wrap: wrap; }
  .status .pill { background: #fff; border: 1px solid #cfd6e0; border-radius: 999px; padding: 4px 12px; }
  .status .hp { color: #c0392b; font-weight: 600; }
  .scene { padding: 24px; min-height: 280px; line-height: 1.8; font-size: 16px; }
  .scene h2 { color: #2c4a6b; margin-top: 0; }
  .npc { background: #fff8e1; border-left: 4px solid #f4b400; padding: 10px 14px; margin: 10px 0; border-radius: 4px; }
  .tori { background: #e3f2fd; border-left: 4px solid #1976d2; padding: 10px 14px; margin: 10px 0; border-radius: 4px; }
  .kp { background: #e8f5e9; border: 1px dashed #43a047; padding: 8px 12px; margin: 10px 0; border-radius: 4px; color: #1b5e20; font-weight: 600; }
  .hint { background: #fff3e0; border-left: 4px solid #fb8c00; padding: 10px 14px; margin: 10px 0; border-radius: 4px; font-size: 14px; }
  .ok { color: #2e7d32; font-weight: 700; }
  .ng { color: #c62828; font-weight: 700; }
  .formula { background: #f5f5f5; border: 1px solid #ccc; padding: 10px 14px; margin: 10px 0; border-radius: 4px; font-family: "Courier New", monospace; font-size: 15px; text-align: center; }
  .diagram { font-family: "Courier New", monospace; background: #f0f4fa; padding: 12px; border-radius: 6px; white-space: pre; font-size: 13px; line-height: 1.4; overflow-x: auto; }
  table { border-collapse: collapse; margin: 12px 0; font-size: 14px; }
  table th, table td { border: 1px solid #999; padding: 6px 10px; text-align: center; }
  table th { background: #e0e7f1; }
  .choices { padding: 0 24px 24px; display: flex; flex-direction: column; gap: 10px; }
  .choices button { background: #2c4a6b; color: #fff; border: none; padding: 12px 18px; border-radius: 8px; font-size: 15px; cursor: pointer; text-align: left; transition: all 0.2s; font-family: inherit; }
  .choices button:hover { background: #3d6493; transform: translateX(4px); }
  .choices button.boss { background: #c0392b; }
  .choices button.boss:hover { background: #e74c3c; }
  footer { padding: 10px 24px; background: #f3f6fb; font-size: 12px; color: #666; text-align: center; }
</style>
</head>
<body>
<div class="game">
  <header>
    <h1>🌪️ 變動的大氣：探空見習生日誌</h1>
    <div class="sub">第三關 — 4-3 大氣的運動</div>
  </header>
  <div class="status">
    <span class="pill hp">❤️ 體力 <span id="hp">100</span></span>
    <span class="pill">🏅 徽章 <span id="badge">0</span></span>
    <span class="pill">🎒 裝備 <span id="items">無</span></span>
    <span class="pill">📚 知識點 <span id="kp">0</span> / 9</span>
  </div>
  <div class="scene" id="scene"></div>
  <div class="choices" id="choices"></div>
  <footer>本關難度最高，請仔細閱讀說明。答錯會扣體力，可重答。</footer>
</div>

<script>
const state = { hp: 100, badges: [], items: [], kp: new Set(), kpTotal: 9 };

function render() {
  document.getElementById('hp').textContent = state.hp;
  document.getElementById('badge').textContent = state.badges.length;
  document.getElementById('items').textContent = state.items.length ? state.items.join('、') : '無';
  document.getElementById('kp').textContent = state.kp.size;
}

function go(id) {
  const s = scenes[id];
  document.getElementById('scene').innerHTML = s.html;
  const c = document.getElementById('choices');
  c.innerHTML = '';
  (s.choices || []).forEach(ch => {
    const b = document.createElement('button');
    b.textContent = ch.label;
    if (ch.boss) b.classList.add('boss');
    b.onclick = () => { if (ch.effect) ch.effect(); render(); go(ch.next); };
    c.appendChild(b);
  });
  render();
  window.scrollTo(0, 0);
}

    html: `

      <div class="npc">👨‍✈️ <b>機長</b>：「見習生，今天我們要學的是<b>讓空氣動起來的力</b>。風是水平運動，雲雨是垂直運動，兩者各有它的原因。」</div>

    ]
  },

    html: `
      <h2>① 絕熱過程 — 雲是怎麼來的</h2>
      <p>偵察機爬升中。機長指著艙外飄起的小雲。</p>
      <div class="npc">👨‍✈️ <b>機長</b>：「想像一團<b>空氣塊</b>從地面被推上去。它和外界<b>沒有熱量交換</b>，這叫<b>絕熱過程</b>。」</div>
      <p>過程：</p>
      <ul>
        <li><b>絕熱上升</b>：高空氣壓小 → 空氣塊膨脹 → 分子撞擊變少 → 溫度<b>下降</b>（絕熱膨脹降溫）</li>
        <li><b>絕熱下沉</b>：低空氣壓大 → 空氣塊壓縮 → 溫度<b>上升</b>（絕熱壓縮升溫）</li>
      </ul>
      <div class="hint">💡 關鍵：絕熱「沒有」熱量出入，溫度變化全來自於體積變化（壓縮 / 膨脹）。</div>
      <p>當空氣塊上升到某高度，溫度降到<b>露點</b>時，水氣達飽和開始凝結成雲——這就是雲底高度的由來。</p>

  h1_wrong: { html: `<p class="ng">❌ 不對。</p><div class="hint">💡 等壓線密 = 短距離氣壓差大 = 推力大 = 風強。</div>`, choices: [{ label: '↩ 重新思考', next: 'h1_pgf' }] },

  },
  b2_wrong_a: { html: `<p class="ng">❌ A 是正確敘述（不是錯誤）。</p><div class="hint">💡 題目問「錯誤」的——找出講錯的那個。</div>`, choices: [{ label: '↩ 重答', next: 'boss2' }] },
  b2_wrong_b: { html: `<p class="ng">❌ B 是正確敘述。</p>`, choices: [{ label: '↩ 重答', next: 'boss2' }] },
  b2_wrong_d: { html: `<p class="ng">❌ D 是正確敘述。</p>`, choices: [{ label: '↩ 重答', next: 'boss2' }] },
  b2_right: { html: `<p class="ok">✅ 正確！C 是錯誤敘述。</p><p>科氏力<b>只改變方向、不改變速率</b>（永遠垂直於運動方向，不做功）。</p>`, choices: [{ label: '➡ 進入第 3 題', next: 'boss3' }] },

  boss3: {
    html: `
      <h2>⚔️ Boss 戰　第 3 題（氣旋方向）</h2>
      <p>颱風（熱帶氣旋）為強烈的<b>低壓系統</b>。請判斷：</p>
      <p>在<b>北半球</b>，從衛星雲圖俯瞰，颱風的氣流方向應為？</p>
    `,
    choices: [
      { label: 'A. 順時針方向旋入', next: 'b3_wrong', effect: () => state.hp -= 20 },
      { label: 'B. 逆時針方向旋入', next: 'b3_right', effect: () => state.hp = Math.min(100, state.hp + 10) },
      { label: 'C. 直接從外圍直線吹向中心', next: 'b3_wrong', effect: () => state.hp -= 20 },
      { label: 'D. 從中心向外輻散', next: 'b3_wrong', effect: () => state.hp -= 20 }
    ]
  },
  b3_wrong: { html: `<p class="ng">❌ 不對。</p><div class="hint">💡 北半球氣流向右偏 → 從四周流入中心的氣流被偏轉成<b>逆時針</b>旋入（南半球則順時針）。</div>`, choices: [{ label: '↩ 重答', next: 'boss3' }] },
  b3_right: { html: `<p class="ok">✅ 正確！</p><p>北半球低壓 = <b>逆時針</b>輻合上升；高壓 = <b>順時針</b>輻散下沉。南半球相反。</p>`, choices: [{ label: '➡ 進入最後第 4 題', next: 'boss4' }] },

  boss4: {
    html: `
      <h2>⚔️ Boss 戰　第 4 題（綜合題）</h2>
      <p>關於<b>地轉風</b>與<b>地面風</b>的比較，下列敘述何者正確？（綜合判斷）</p>
    `,
    choices: [
      { label: 'A. 地轉風受 PGF、科氏力、摩擦力三力平衡', next: 'b4_wrong', effect: () => state.hp -= 20 },
      { label: 'B. 地面風方向平行於等壓線', next: 'b4_wrong', effect: () => state.hp -= 20 },
      { label: 'C. 地轉風方向平行等壓線；地面風與等壓線斜交且偏向低壓', next: 'b4_right', effect: () => state.hp = Math.min(100, state.hp + 10) },
      { label: 'D. 摩擦力會使地面風速度比高空地轉風更快', next: 'b4_wrong', effect: () => state.hp -= 20 }
    ]
  },
  b4_wrong: { html: `<p class="ng">❌ 不對。</p><div class="hint">💡 地轉風：高空、無摩擦、兩力平衡、平行等壓線。地面風：低空、三力平衡、與等壓線斜交、風速較慢。</div>`, choices: [{ label: '↩ 重答', next: 'boss4' }] },
  b4_right: {
    html: `<p class="ok">✅ 完全正確！</p><p>這正是大氣運動最核心的概念：高空兩力平衡 vs. 低空三力平衡。</p>
      <div class="kp">🏅 獲得徽章：<b>風暴駕馭徽章</b></div>`,
    choices: [{ label: '🎉 過關！', next: 'end', effect: () => { state.badges.push('風暴駕馭徽章'); state.items.push('氣象偵察機飛行紀錄'); } }]
  },

  end: {
    html: `
      <h2>🏅 第三關過關！</h2>
      <p>體力：<b><span id="endHp"></span></b>　／　徽章：<b><span id="endBadges"></span></b></p>
      <div class="npc">👨‍✈️ <b>機長</b>：「這關是整章最硬的。你撐過來了——下一站，是中央氣象局作業中心，學著畫天氣圖、預報天氣。」</div>
      <hr>
      <h3>📝 學習回顧</h3>
      <ol>
        <li>絕熱膨脹降溫 vs. 絕熱壓縮升溫的物理原因。</li>
        <li>列出 4 種讓空氣上升的機制，並各舉一例。</li>
        <li>氣壓梯度力的方向？大小與什麼有關？</li>
        <li>科氏力的方向、大小、特性（記住「只改方向不改速率」）。</li>
        <li>地轉風 vs. 地面風的力學差異與風向差異。</li>
        <li>北半球氣旋（低壓）與反氣旋（高壓）的旋轉方向？</li>
      </ol>
    `,
    choices: [
      { label: '🔄 重新挑戰本關', next: 'start', effect: () => { state.hp = 100; state.badges = []; state.items = []; state.kp = new Set(); } }
    ]
  }

};

const origGo = go;
window.go = function(id) {
  origGo(id);
  if (id === 'end') {
    const eh = document.getElementById('endHp');
    const eb = document.getElementById('endBadges');
    if (eh) eh.textContent = state.hp;
    if (eb) eb.textContent = state.badges.join('、');
  }
};

go('start');
</script>
