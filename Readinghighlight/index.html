<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文閱讀冒險站</title>
<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary:   #1a1040;
  --accent:    #c8b870;
  --bg:        #07071e;
  --card:      rgba(255,255,255,.05);
  --border:    rgba(255,255,255,.12);
  --text:      #e0d8f8;
  --muted:     #8878b8;
  --ok:        #4caf88;
  --err:       #e05560;
  --radius:    16px;
}

body {
  font-family: 'Noto Serif TC', Georgia, serif;
  background: radial-gradient(ellipse at 50% 0%, #1a1040 0%, #07071e 60%, #030310 100%);
  min-height: 100vh;
  color: var(--text);
  overflow-x: hidden;
}

/* ── Stars deco ── */
.star {
  position: fixed; background: white; border-radius: 50%;
  animation: twinkle var(--dur, 3s) ease-in-out infinite;
  opacity: var(--op, .3); pointer-events: none;
}
@keyframes twinkle {
  0%,100% { opacity: var(--op,.3); transform: scale(1); }
  50%      { opacity: 1; transform: scale(1.4); }
}

/* ── Layout ── */
#app { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 0 0 60px; }

/* ── Login Screen ── */
#loginScreen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; padding: 30px 20px;
}
.login-logo { font-size: 3.5em; margin-bottom: 16px; animation: floatLogo 4s ease-in-out infinite; }
@keyframes floatLogo {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-10px); }
}
.login-title {
  font-size: 1.8em; font-weight: 800; color: var(--accent);
  text-shadow: 0 0 20px rgba(200,184,112,.4); margin-bottom: 6px; text-align: center;
}
.login-sub { font-size: .85em; color: var(--muted); margin-bottom: 32px; letter-spacing: 1px; text-align: center; }
.login-box {
  background: rgba(255,255,255,.06); border: 1px solid rgba(200,184,112,.25);
  border-radius: var(--radius); padding: 28px 24px; width: 100%; max-width: 380px;
  backdrop-filter: blur(12px);
}
.login-box label { display: block; font-size: .78em; color: var(--muted); margin-bottom: 6px; letter-spacing: 1px; }
.login-box input {
  width: 100%; background: rgba(255,255,255,.08); border: 1px solid rgba(200,184,112,.3);
  border-radius: 10px; color: var(--text); padding: 10px 14px; font-size: .92em;
  outline: none; font-family: inherit; margin-bottom: 16px; transition: border-color .2s;
}
.login-box input:focus { border-color: var(--accent); }
.btn-primary {
  width: 100%; background: linear-gradient(135deg, #4030a0, #8858d8);
  border: none; color: white; padding: 12px; border-radius: 12px;
  font-size: .95em; font-weight: 700; cursor: pointer; font-family: inherit;
  transition: opacity .2s; letter-spacing: .5px;
}
.btn-primary:hover { opacity: .85; }

/* ── Dashboard ── */
#dashboard { display: none; padding: 0 16px; }

/* Top bar */
.top-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 16px 0 12px; border-bottom: 1px solid var(--border);
}
.top-title {
  font-size: 1.15em; font-weight: 800; color: var(--accent); flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.top-name { font-size: .8em; color: var(--muted); }
.btn-sm {
  background: rgba(255,255,255,.07); border: 1px solid var(--border);
  color: var(--muted); padding: 6px 13px; border-radius: 10px;
  font-size: .78em; cursor: pointer; font-family: inherit; transition: all .2s; white-space: nowrap;
}
.btn-sm:hover { background: rgba(255,255,255,.13); color: var(--text); }
.btn-accent {
  background: rgba(200,184,112,.15); border: 1px solid rgba(200,184,112,.35);
  color: var(--accent);
}
.btn-accent:hover { background: rgba(200,184,112,.28); color: var(--accent); }

/* Sync bar */
.sync-bar {
  display: flex; align-items: center; gap: 8px; padding: 8px 0;
  font-size: .78em; color: var(--muted); border-bottom: 1px solid var(--border);
  min-height: 36px;
}
.sync-dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: #555; flex-shrink: 0; transition: background .3s;
}
.sync-dot.ok      { background: var(--ok); }
.sync-dot.err     { background: var(--err); }
.sync-dot.loading { background: #4488ff; animation: pulse .8s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity:.4; transform:scale(.8); } 50% { opacity:1; transform:scale(1.2); } }
.sync-msg { flex: 1; }
.btn-retry {
  background: rgba(200,184,112,.12); border: 1px solid rgba(200,184,112,.3);
  color: var(--accent); padding: 3px 10px; border-radius: 8px;
  font-size: .82em; cursor: pointer; font-family: inherit; display: none;
}

/* Stats row */
.stats-row {
  display: flex; gap: 0; padding: 14px 0; border-bottom: 1px solid var(--border);
}
.stat-box { flex: 1; text-align: center; }
.stat-box + .stat-box { border-left: 1px solid var(--border); }
.stat-num  { font-size: 1.6em; font-weight: 800; color: var(--accent); }
.stat-lbl  { font-size: .68em; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

/* Section header */
.section-hd {
  font-size: .72em; color: var(--muted); letter-spacing: 2px;
  text-transform: uppercase; padding: 18px 0 10px;
}

/* ── Course Card ── */
.course-card {
  position: relative; background: var(--card); border: 2px solid var(--border);
  border-radius: var(--radius); padding: 18px 18px 14px;
  margin-bottom: 14px; cursor: pointer; transition: all .25s; overflow: hidden;
  text-decoration: none; display: block; color: inherit;
}
.course-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,.4); }

/* Color accent strip */
.course-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
}
.color-teal::before   { background: linear-gradient(90deg, #1a9e8f, #4ecdc4); }
.color-blue::before   { background: linear-gradient(90deg, #3060c8, #60a0f8); }
.color-purple::before { background: linear-gradient(90deg, #7030b8, #c060f0); }
.color-red::before    { background: linear-gradient(90deg, #c03040, #f06878); }
.color-orange::before { background: linear-gradient(90deg, #c07028, #f0a858); }

/* Seal */
.course-seal {
  position: absolute; top: 14px; right: 14px;
  width: 46px; height: 46px; border-radius: 50%; border: 2px solid;
  display: flex; align-items: center; justify-content: center;
  font-size: .82em; font-weight: 800; letter-spacing: 1px; opacity: .85;
}
.color-teal   .course-seal { border-color: #4ecdc4; color: #4ecdc4; }
.color-blue   .course-seal { border-color: #60a0f8; color: #60a0f8; }
.color-purple .course-seal { border-color: #c060f0; color: #c060f0; }
.color-red    .course-seal { border-color: #f06878; color: #f06878; }
.color-orange .course-seal { border-color: #f0a858; color: #f0a858; }

/* Card body */
.card-lesson { font-size: .72em; color: var(--muted); letter-spacing: 1px; margin-bottom: 4px; }
.card-title  { font-size: 1.05em; font-weight: 800; color: var(--accent); margin-bottom: 12px; padding-right: 54px; }

/* Stars & progress */
.card-stars  { font-size: .88em; color: var(--muted); margin-bottom: 8px; }
.card-stars span { color: var(--accent); font-weight: 700; margin: 0 2px; }

.prog-bar    { height: 5px; background: rgba(255,255,255,.1); border-radius: 3px; margin-bottom: 8px; overflow: hidden; }
.prog-fill   { height: 100%; border-radius: 3px; transition: width .6s ease; }
.color-teal   .prog-fill { background: linear-gradient(90deg, #1a9e8f, #4ecdc4); }
.color-blue   .prog-fill { background: linear-gradient(90deg, #3060c8, #60a0f8); }
.color-purple .prog-fill { background: linear-gradient(90deg, #7030b8, #c060f0); }
.color-red    .prog-fill { background: linear-gradient(90deg, #c03040, #f06878); }
.color-orange .prog-fill { background: linear-gradient(90deg, #c07028, #f0a858); }

/* Level mini-dots */
.lv-dots { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
.lv-dot-mini {
  width: 28px; height: 22px; border-radius: 6px;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
  display: flex; align-items: center; justify-content: center;
  font-size: .65em; letter-spacing: 0;
}
.lv-dot-mini.s1 { background: rgba(255,255,255,.1); }
.lv-dot-mini.s2 { background: rgba(80,160,80,.2);  border-color: rgba(80,160,80,.4); }
.lv-dot-mini.s3 { background: rgba(200,184,112,.2); border-color: rgba(200,184,112,.5); }

/* Status badge */
.status-badge {
  display: inline-block; padding: 3px 10px; border-radius: 9px;
  font-size: .7em; font-weight: 700; letter-spacing: .5px; margin-bottom: 6px;
}
.badge-none { background: rgba(255,255,255,.08); color: var(--muted); }
.badge-going { background: rgba(70,130,220,.2); color: #70a8f8; }
.badge-done  { background: rgba(80,160,80,.2);  color: #80d898; }

.card-msg { font-size: .78em; color: var(--muted); line-height: 1.5; }

/* ── Modal ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65);
  z-index: 999; align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: #12103a; border: 1px solid rgba(200,184,112,.3);
  border-radius: var(--radius); padding: 26px 22px; max-width: 360px; width: 100%;
}
.modal-title { font-size: 1.05em; font-weight: 800; color: var(--accent); margin-bottom: 10px; }
.modal-body  { font-size: .88em; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
.modal-btns  { display: flex; gap: 10px; }
.btn-modal-cancel {
  flex: 1; background: rgba(255,255,255,.07); border: 1px solid var(--border);
  color: var(--muted); padding: 9px; border-radius: 10px;
  font-size: .88em; cursor: pointer; font-family: inherit;
}
.btn-modal-ok {
  flex: 1; background: linear-gradient(135deg, #8030c8, #c060f0);
  border: none; color: white; padding: 9px; border-radius: 10px;
  font-size: .88em; font-weight: 700; cursor: pointer; font-family: inherit;
}

/* ── Toast ── */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: rgba(20,18,50,.95); border: 1px solid var(--border);
  color: var(--text); padding: 10px 20px; border-radius: 20px;
  font-size: .85em; font-weight: 600; z-index: 9999;
  transition: transform .3s ease; pointer-events: none; white-space: nowrap;
  backdrop-filter: blur(8px);
}
#toast.show { transform: translateX(-50%) translateY(0); }
#toast.ok  { border-color: var(--ok); color: var(--ok); }
#toast.err { border-color: var(--err); color: var(--err); }

/* ── Responsive ── */
@media (max-width: 420px) {
  .top-bar { gap: 6px; }
  .btn-sm  { padding: 5px 10px; font-size: .74em; }
  .stat-num { font-size: 1.35em; }
}
</style>
</head>
<body>

<!-- Stars -->
<script>
for (let i = 0; i < 60; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const sz = Math.random() * 2.5 + .5;
  s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}vh;left:${Math.random()*100}vw;--dur:${2+Math.random()*4}s;--op:${.15+Math.random()*.5}`;
  document.body.appendChild(s);
}
</script>

<div id="app">

  <!-- ── LOGIN ── -->
  <div id="loginScreen">
    <div class="login-logo">📖</div>
    <div class="login-title">英文閱讀冒險站</div>
    <div class="login-sub">高中英文 Reading Highlight 互動練習</div>
    <div class="login-box">
      <label>學號</label>
      <input id="inId" type="text" placeholder="請輸入學號" maxlength="20" autocomplete="username">
      <label>姓名</label>
      <input id="inName" type="text" placeholder="請輸入姓名" maxlength="30" autocomplete="name">
      <button class="btn-primary" onclick="login()">登入 → 開始冒險</button>
    </div>
  </div>

  <!-- ── DASHBOARD ── -->
  <div id="dashboard">

    <!-- Top bar -->
    <div class="top-bar">
      <div>
        <div class="top-title">英文閱讀冒險站</div>
        <div class="top-name" id="topName"></div>
      </div>
      <button class="btn-sm btn-accent" onclick="syncAll()">☁ 同步雲端</button>
      <button class="btn-sm" onclick="confirmLoad()">⬇ 載入進度</button>
      <button class="btn-sm" onclick="confirmSwitch()">↩ 切換帳號</button>
    </div>

    <!-- Sync bar -->
    <div class="sync-bar">
      <div class="sync-dot" id="syncDot"></div>
      <div class="sync-msg" id="syncMsg">尚未同步</div>
      <button class="btn-retry" id="retryBtn" onclick="syncAll()">↻ 重試</button>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-num" id="statDone">0</div>
        <div class="stat-lbl">已完成關卡</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-lbl">總關卡數</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="statStars">0</div>
        <div class="stat-lbl">累計獲得 ★</div>
      </div>
    </div>

    <div class="section-hd">課程列表</div>

    <!-- Cards injected here -->
    <div id="cardList"></div>

  </div><!-- /dashboard -->
</div><!-- /app -->

<!-- Modals -->
<div class="modal-overlay" id="modalLoad" onclick="closeModal('modalLoad')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title">⬇ 從雲端載入進度</div>
    <div class="modal-body">此動作將以雲端資料覆蓋本機進度，尚未同步的本機紀錄將遺失。確定要繼續嗎？</div>
    <div class="modal-btns">
      <button class="btn-modal-cancel" onclick="closeModal('modalLoad')">取消</button>
      <button class="btn-modal-ok"     onclick="doLoad()">確定載入</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalSwitch" onclick="closeModal('modalSwitch')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title">↩ 切換帳號</div>
    <div class="modal-body">此動作將清除本機所有進度資料並回到登入畫面。請先確認已同步至雲端。</div>
    <div class="modal-btns">
      <button class="btn-modal-cancel" onclick="closeModal('modalSwitch')">取消</button>
      <button class="btn-modal-ok"     onclick="doSwitch()">確定切換</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════
const API_URL     = 'https://script.google.com/macros/s/AKfycbzrc4ugyD2PnfOyJ4wHJvFk38vgkCVXhjME9ZH5QhzihLalo4D9rmKf7ZndQMKO5472NQ/exec';
const STUDENT_KEY = 'hc_student';
const FETCH_TIMEOUT = 10000;

const COURSES = [
  {
    id: 'l19', key: 'l19_progress', file: 'readinghighlight_19.html',
    title: 'Day of the Dead', lesson: 'Lesson 19 · Mexico\'s Fabulous Day of the Dead',
    total: 6, seal: '亡靈', color: 'purple',
    msg: {
      none:  '探索墨西哥亡靈節的神秘傳統，展開英文閱讀冒險！',
      going: '繼續加油！完成剩餘關卡，取得亡靈探索者印記。',
      done:  '🎉 恭喜取得「亡靈探索者印記」！全部通關！'
    }
  },
  {
    id: 'l20', key: 'l20_progress', file: 'readinghighlight_20.html',
    title: 'A Walk in the Night', lesson: 'Lesson 20 · The Mystery of Sleepwalking',
    total: 5, seal: '夜行', color: 'blue',
    msg: {
      none:  '解開夜遊症的謎團，成為英文閱讀偵探！',
      going: '繼續前進！解開剩餘關卡，取得夜行偵探印記。',
      done:  '🎉 恭喜取得「夜行偵探印記」！全部通關！'
    }
  },
  {
    id: 'l21', key: 'l21_progress', file: 'readinghighlight_21.html',
    title: 'The Amazing Hoover Dam', lesson: 'Lesson 21 · Engineering Wonder',
    total: 4, seal: '壩奇', color: 'teal',
    msg: {
      none:  '探索胡佛水壩的工程奇蹟，展開英文閱讀挑戰！',
      going: '繼續挑戰！完成剩餘關卡，取得工程奇才印記。',
      done:  '🎉 恭喜取得「工程奇才印記」！全部通關！'
    }
  },
  {
    id: 'l22', key: 'l22_progress', file: 'readinghighlight_22.html',
    title: 'The Most Famous Meal', lesson: 'Lesson 22 · The Last Supper',
    total: 5, seal: '名畫', color: 'orange',
    msg: {
      none:  '探索達文西最後晚餐的藝術奧秘，開始英文閱讀之旅！',
      going: '繼續前進！探索剩餘關卡，取得藝術鑑賞印記。',
      done:  '🎉 恭喜取得「藝術鑑賞印記」！全部通關！'
    }
  }
];

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let student = null;

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
(function init() {
  try { student = JSON.parse(localStorage.getItem(STUDENT_KEY) || 'null'); } catch { student = null; }
  if (student && student.id) {
    showDashboard();
  }
  document.getElementById('inId').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  document.getElementById('inName').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
})();

// ═══════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════
function login() {
  const id   = (document.getElementById('inId').value   || '').trim();
  const name = (document.getElementById('inName').value || '').trim();
  if (!id) { showToast('請輸入學號', 'err'); return; }
  student = { id, name: name || id };
  localStorage.setItem(STUDENT_KEY, JSON.stringify(student));
  showDashboard();
  fetchFromCloud();
}

function confirmSwitch() { openModal('modalSwitch'); }
function doSwitch() {
  closeModal('modalSwitch');
  student = null;
  localStorage.removeItem(STUDENT_KEY);
  COURSES.forEach(c => localStorage.removeItem(c.key));
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('inId').value = '';
  document.getElementById('inName').value = '';
}

// ═══════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════
function showDashboard() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('topName').textContent = `${esc(student.name)} · ${esc(student.id)}`;
  renderCards();
}

function renderCards() {
  let totalDone = 0, totalLevels = 0, totalStars = 0;

  document.getElementById('cardList').innerHTML = COURSES.map(c => {
    const prog = getProgress(c);
    totalDone   += prog.done;
    totalLevels += c.total;
    totalStars  += prog.stars;

    const pct    = c.total > 0 ? Math.round((prog.done / c.total) * 100) : 0;
    const status = prog.done === 0 ? 'none' : prog.done >= c.total ? 'done' : 'going';
    const badgeCls = { none: 'badge-none', going: 'badge-going', done: 'badge-done' }[status];
    const badgeTxt = { none: '未開始', going: '進行中', done: '已完成' }[status];

    const dots = Array.from({ length: c.total }, (_, i) => {
      const lv  = i + 1;
      const st  = prog.levelStars[lv] || 0;
      const cls = st === 3 ? 's3' : st === 2 ? 's2' : st === 1 ? 's1' : '';
      const sym = st === 3 ? '★★★' : st === 2 ? '★★☆' : st === 1 ? '★☆☆' : '—';
      return `<div class="lv-dot-mini ${cls}" title="Lv${lv}: ${sym}">${sym}</div>`;
    }).join('');

    const maxStars = c.total * 3;
    return `
<a class="course-card color-${c.color}" href="${esc(c.file)}">
  <div class="course-seal">${esc(c.seal)}</div>
  <div class="card-lesson">${esc(c.lesson)}</div>
  <div class="card-title">${esc(c.title)}</div>
  <div class="card-stars">★ ${prog.stars} <span>/</span> ${maxStars} 星</div>
  <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
  <div style="font-size:.72em;color:var(--muted);margin-bottom:8px">${prog.done} / ${c.total} 關</div>
  <div class="lv-dots">${dots}</div>
  <span class="status-badge ${badgeCls}">${badgeTxt}</span>
  <div class="card-msg">${esc(c.msg[status])}</div>
</a>`;
  }).join('');

  document.getElementById('statDone').textContent  = totalDone;
  document.getElementById('statTotal').textContent = totalLevels;
  document.getElementById('statStars').textContent = totalStars;
}

function getProgress(course) {
  let raw = {};
  try { raw = JSON.parse(localStorage.getItem(course.key) || '{}'); } catch {}
  let done = 0, stars = 0;
  const levelStars = {};
  for (let i = 1; i <= course.total; i++) {
    const st = raw[i] || 0;
    levelStars[i] = st;
    if (st >= 2) done++;
    stars += st;
  }
  return { done, stars, levelStars };
}

// ═══════════════════════════════════════════
// CLOUD SYNC
// ═══════════════════════════════════════════
function setSyncUI(state, msg) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncMsg');
  const btn = document.getElementById('retryBtn');
  dot.className = 'sync-dot ' + state;
  txt.textContent = msg;
  btn.style.display = state === 'err' ? 'inline-block' : 'none';
}

async function apiFetch(params) {
  if (!API_URL || API_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
    return { ok: false, error: '尚未設定雲端 URL' };
  }
  if (!navigator.onLine) return { ok: false, error: '裝置已離線' };
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT);
  try {
    const url = API_URL + '?' + new URLSearchParams(params).toString();
    const res = await fetch(url, { signal: ctrl.signal });
    clearTimeout(timer);
    const text = await res.text();
    try { return JSON.parse(text); }
    catch { return { ok: false, error: text.slice(0, 120) }; }
  } catch (e) {
    clearTimeout(timer);
    if (e.name === 'AbortError') return { ok: false, error: '連線逾時' };
    return { ok: false, error: e.message || '連線失敗' };
  }
}

async function syncAll() {
  if (!student?.id) return;
  setSyncUI('loading', '同步中…');
  document.getElementById('retryBtn').style.display = 'none';
  const params = { action: 'set', id: student.id, name: student.name || '' };
  COURSES.forEach(c => { params[c.id] = localStorage.getItem(c.key) || '{}'; });
  params.t = Date.now();
  const res = await apiFetch(params);
  if (res.ok) {
    setSyncUI('ok', '同步完成 · ' + new Date().toLocaleTimeString());
    showToast('已同步至雲端', 'ok');
  } else {
    setSyncUI('err', res.error || '同步失敗');
    showToast(res.error || '同步失敗', 'err');
  }
}

function confirmLoad() { openModal('modalLoad'); }
async function doLoad() {
  closeModal('modalLoad');
  if (!student?.id) return;
  setSyncUI('loading', '載入中…');
  const res = await apiFetch({ action: 'get', id: student.id });
  if (res.ok) {
    COURSES.forEach(c => {
      const val = res[c.key];   // Apps Script 以 header 名稱（l19_progress）回傳
      if (val) localStorage.setItem(c.key, val);
    });
    renderCards();
    setSyncUI('ok', '已從雲端載入 · ' + new Date().toLocaleTimeString());
    showToast('進度已載入', 'ok');
  } else {
    const msg = res.error === 'not found'
      ? '雲端尚無此帳號的紀錄'
      : (res.error || '載入失敗');
    setSyncUI('err', msg);
    showToast(msg, 'err');
  }
}

async function fetchFromCloud() {
  if (!student?.id) return;
  setSyncUI('loading', '載入雲端進度…');
  const res = await apiFetch({ action: 'get', id: student.id });
  if (res.ok) {
    COURSES.forEach(c => {
      const val = res[c.key];   // Apps Script 以 header 名稱（l19_progress）回傳
      if (val) localStorage.setItem(c.key, val);
    });
    renderCards();
    setSyncUI('ok', '已從雲端載入 · ' + new Date().toLocaleTimeString());
  } else if (res.error && !res.error.includes('URL')) {
    setSyncUI('err', res.error);
  } else {
    setSyncUI('', '（本機模式）');
  }
}

// ═══════════════════════════════════════════
// MODAL / TOAST
// ═══════════════════════════════════════════
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 2500);
}

// ═══════════════════════════════════════════
// UTIL
// ═══════════════════════════════════════════
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
